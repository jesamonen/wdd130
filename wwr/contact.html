<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | RapidXtreme</title>

    <meta name="description"
      content="Join RapidXtreme for exciting white water rafting trips. Enjoy safe, guided adventures through stunning rivers and create unforgettable memories.">
    <meta name="author" content="Jesam Onen">

    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <img src="images/z-splash.png" alt="RapidXtreme logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <!-- MAIN -->
    <main>

    <!-- CONTACT INFO -->
    <section class="contact-info">
        <h1>Contact RapidXtreme</h1>
        <p>123 Lekki Epe express way Onishon, Lagos</p>
        <p>📞 +234 7039 8428 79</p>
        <p>📧 info@rapidxtrme.com</p>
    </section>

    <!-- GOOGLE MAP -->
    <section class="map">
        <div class="map">
  <iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3966.0320948543626!2d3.563946675820598!3d6.508946895132653!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x103bf437b4e8e0af%3A0x1234567890abcdef!2s123%20Lekki%20Epe%20Expressway%2C%20Onishon%2C%20Lagos%2C%20Nigeria!5e0!3m2!1sen!2sng!4v1700000000000!5m2!1sen!2sng"
    width="100%"
    height="300"
    style="border:0;"
    allowfullscreen=""
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
</div>
    </section>

    <!-- EMPLOYEES -->
    <section class="employees">
        <h2>We Are Here to Serve You</h2>

        <div class="employee-gallery">
            <figure>
                <img src="images/employee1.jpg" alt="Guide">
                <figcaption>John Doe - Lead Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Manager">
                <figcaption>Jane Smith - Operations Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Support">
                <figcaption>Mike Lee - Customer Support</figcaption>
            </figure>
        </div>
    </section>

    <!-- CONTACT FORM -->
    <section class="contact-form">
        <h2>Get in Touch</h2>

        <form action="#" method="post">

            <!-- NAME -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <!-- EMAIL -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <!-- RADIO BUTTONS -->
            <p>Message Purpose:</p>

            <label>
                <input type="radio" name="purpose" value="general" required>
                General Inquiry
            </label>

            <label>
                <input type="radio" name="purpose" value="reservation">
                Reservation Question
            </label>

            <label>
                <input type="radio" name="purpose" value="suggestion">
                Website Suggestion
            </label>

            <!-- MESSAGE -->
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5"></textarea>

            <!-- CHECKBOX -->
            <label>
                <input type="checkbox" name="subscribe">
                Please subscribe me to the monthly newsletter
            </label>

            <!-- SUBMIT -->
            <button type="submit">Get in Touch!</button>

        </form>
    </section>

</main>


   

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 RapidXtreme | Jesam Onen</p>

        <nav class="socialmedia">
            <a href="#"><img src="images/facebook1.jpg" alt="Facebook"></a>
            <a href="#"><img src="images/twitter1.jpg" alt="Twitter"></a>
            <a href="#"><img src="images/instagram1.jpg" alt="Instagram"></a>
        </nav>
    </footer>

</body>

</html>
